# 上游 M3U 订阅源配置
# 按优先级从高到低排列:同一频道去重时保留排在前面的源
# (2026-10-06 更新:改用 vbskycn/iptv,每日自动更新,含 IPv4/IPv6 双栈)
upstreams:
  - name: "vbskycn-IPv4"
    url: "https://raw.githubusercontent.com/vbskycn/iptv/master/tv/iptv4.m3u"
  - name: "vbskycn-IPv6"
    url: "https://raw.githubusercontent.com/vbskycn/iptv/master/tv/iptv6.m3u"

# 可选:只保留这些关键词的频道(留空=全部保留)
# include_keywords:
#   - "CCTV"
#   - "卫视"

# 可选:排除这些关键词的频道
# exclude_keywords:
#   - "购物"
